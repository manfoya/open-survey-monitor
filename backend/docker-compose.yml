version: '3.8'

services:
  # Base de données PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: survey_db
    environment:
      POSTGRES_DB: open_survey_monitor
      POSTGRES_USER: survey_user
      POSTGRES_PASSWORD: survey_password_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - survey_postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey_user -d open_survey_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin pour administrer la base (optionnel)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: survey_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@survey.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - survey_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database
    profiles:
      - admin
    restart: unless-stopped

volumes:
  survey_postgres_data:
    driver: local
  survey_pgadmin_data:
    driver: local