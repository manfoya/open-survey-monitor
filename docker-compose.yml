services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: survey_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_survey_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-survey_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-survey_password_prod}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - survey_postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-survey_user} -d ${POSTGRES_DB:-open_survey_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: survey_backend_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-survey_user}:${POSTGRES_PASSWORD:-survey_password_prod}@db:5432/${POSTGRES_DB:-open_survey_monitor}
      # Add other environment variables here as needed, or use an env_file
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: survey_frontend_prod
    environment:
      # This needs to point to the PUBLIC URL of the backend if accessed from client (browser)
      # OR the internal container URL if accessed during SSR (server-side rendering)
      # For a simple setup, we might proxy requests or use public URL.
      # Usually Next.js needs public env vars for defining API base URL.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      # Internal URL for SSR (must match backend container name)
      API_URL: http://backend:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  survey_postgres_data_prod:
